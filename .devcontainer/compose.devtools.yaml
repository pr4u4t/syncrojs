services:
  server:
    build:
      args:
        INSTALL_CPP_TOOLS: "true"
        INSTALL_QT_TOOLS: "true"
        INSTALL_DEV_SHELL: "true"
      secrets:
        - extra_ca
  classic-generator:
    build:
      secrets:
        - extra_ca
# extra_ca is defined in compose.yaml: EXTRA_CA_FILE, else an empty placeholder.
# No system path as the default here: /etc/ssl/certs/ca-certificates.crt
# exists on WSL/Linux but not on macOS, and compose fails on a missing secret
# file before building. On WSL behind a TLS-inspecting proxy set
#   EXTRA_CA_FILE=/etc/ssl/certs/ca-certificates.crt
# (in .env or the shell).
