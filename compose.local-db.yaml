services:
  server:
    environment:
      # Dev mode always talks to the compose database below, whatever .env says.
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: syncrojs-local-only
      SYNCRO_HOST: 127.0.0.1
      SYNCRO_PORT: "1"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:10
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: syncrojs-local-only
    volumes:
      - syncrojs-postgres-data:/var/lib/postgresql/data
      - ./data/10/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/10/backup.sql:/docker-entrypoint-initdb.d/02-backup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  syncrojs-postgres-data: